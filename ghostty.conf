font-family = JetBrainsMono Nerd Font Mono
font-size = 14
theme = Catppuccin Mocha
background-opacity = 0.96
alpha-blending = linear-corrected

cursor-style = bar
cursor-color = #cba6f7
cursor-style-blink = false
shell-integration-features = no-cursor

window-padding-x = 12
window-padding-y = 4,12
window-padding-balance = false
confirm-close-surface = false

mouse-hide-while-typing = true

# KWin draws the titlebar; GTK only shows the tab bar once there are 2+ tabs
gtk-titlebar = false
gtk-wide-tabs = false
# `?` keeps macOS quiet where the file isn't linked
gtk-custom-css = ?~/.config/ghostty/tabs.css

# 64 MiB per terminal surface
scrollback-limit = 67108864
