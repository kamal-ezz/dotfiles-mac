font-family = JetBrainsMono Nerd Font Mono
font-size = 14
# Everforest Dark Hard, same values as kitty's theme so the background matches
# Neovim (Ghostty's bundled theme uses the darker bg_dim and light-variant brights)
background = #272e33
foreground = #d3c6aa
selection-background = #464e53
selection-foreground = #9da9a0
cursor-text = #2e383c
palette = 0=#343f44
palette = 1=#e67e80
palette = 2=#a7c080
palette = 3=#dbbc7f
palette = 4=#7fbbb3
palette = 5=#d699b6
palette = 6=#83c092
palette = 7=#859289
palette = 8=#868d80
palette = 9=#e67e80
palette = 10=#a7c080
palette = 11=#dbbc7f
palette = 12=#7fbbb3
palette = 13=#d699b6
palette = 14=#83c092
palette = 15=#9da9a0
background-opacity = 0.96
alpha-blending = linear-corrected

cursor-style = bar
cursor-color = #d3c6aa
cursor-style-blink = false
shell-integration-features = no-cursor

window-padding-x = 12
window-padding-y = 4,12
window-padding-balance = false
confirm-close-surface = false

mouse-hide-while-typing = true

# KWin draws the titlebar; GTK only shows the tab bar once there are 2+ tabs
gtk-titlebar = false
gtk-wide-tabs = false
# `?` keeps macOS quiet where the file isn't linked
gtk-custom-css = ?~/.config/ghostty/tabs.css

# 64 MiB per terminal surface
scrollback-limit = 67108864
