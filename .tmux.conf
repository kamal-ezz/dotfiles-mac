set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -g renumber-windows on
bind-key c new-window -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'
set -g mouse on
# Let mouse-aware apps scroll themselves; otherwise enter tmux scrollback.
bind-key -n WheelUpPane if-shell -F '#{mouse_any_flag}' \
  'send-keys -M' \
  'copy-mode -e'
bind-key -n WheelDownPane send-keys -M
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
setw -g aggressive-resize on
set -as terminal-features ",*:clipboard"
set -g status 2
set -g status-format[0] ''
set -g status-format[1] '#[range=left]#{E:status-left}#[norange default]#[align=left]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange default],#[range=window|#{window_index}]#{E:window-status-current-format}#[norange default]}#[align=right range=right]#{E:status-right}#[norange default]'
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?client_prefix,PREFIX ,}#[fg=brightblack]#h "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
set -sg escape-time 10
set -g allow-rename off
