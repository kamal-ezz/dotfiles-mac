# Colors come from the active theme (bin/theme links kitty.conf and writes kitty-tabs.conf)
include ../dotfiles-theme/kitty.conf

# Custom slanted powerline ribbons on top (kitty/tab_bar.py -> ~/.config/kitty/tab_bar.py).
tab_bar_edge top
tab_bar_style custom
tab_bar_margin_width 8
tab_bar_margin_height 4 4
tab_bar_min_tabs 2
tab_title_max_length 24
globinclude ../dotfiles-theme/kitty-tabs.conf

# Mono variant keeps Nerd Font icons single-width so columns stay aligned.
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Ergonomics: quiet bell, generous scrollback, subtle breathing room, and
# skip the close confirmation when only an idle shell is running.
enable_audio_bell       no
scrollback_lines        10000
window_padding_width    6
confirm_os_window_close -1

# New tabs and windows open in the current directory.
map cmd+t            new_tab_with_cwd
map kitty_mod+t      new_tab_with_cwd
map cmd+enter        new_window_with_cwd
map kitty_mod+enter  new_window_with_cwd
map cmd+n            new_os_window_with_cwd
map kitty_mod+n      new_os_window_with_cwd
