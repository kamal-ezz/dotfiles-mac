# Colors come from the active theme (bin/theme links this file)
include ${HOME}/.config/dotfiles-theme/kitty.conf

# Rounded powerline tabs on top.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_margin_width 8
tab_bar_margin_height 3 4
tab_bar_min_tabs 2
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_max_length 20
tab_title_template " {index} {title} "

# Mono variant keeps Nerd Font icons single-width so columns stay aligned.
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# New tabs and windows open in the current directory.
map cmd+t            new_tab_with_cwd
map kitty_mod+t      new_tab_with_cwd
map cmd+enter        new_window_with_cwd
map kitty_mod+enter  new_window_with_cwd
map cmd+n            new_os_window_with_cwd
map kitty_mod+n      new_os_window_with_cwd
