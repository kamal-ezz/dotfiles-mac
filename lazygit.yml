git:
  diffRenderers:
    - name: delta
      # Theme colors from bin/theme; delta ignores the file when it is missing.
      command: delta --config "${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles-theme/delta.gitconfig" --dark --paging=never --side-by-side --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - type: rawGit
os:
  # Inside Neovim (<leader>gg) files open in that Neovim; elsewhere in plain nvim
  editPreset: nvim-remote
