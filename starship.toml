"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

scan_timeout = 100

# Colors are palette roles; bin/theme appends the active theme's values.
[directory]
style = "bold accent"

[character]
success_symbol = "[❯](accent2)"
error_symbol = "[❯](error)"
vimcmd_symbol = "[❮](info)"

[git_branch]
format = "[$branch]($style)"
style = "muted"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](accent2)( $ahead_behind$stashed) ]($style)"
style = "info"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = ' \([$state( $progress_current/$progress_total)]($style)\) '
style = "muted"

[cmd_duration]
format = "[$duration]($style) "
style = "warn"

[python]
format = "[$virtualenv]($style) "
style = "muted"
detect_extensions = []
detect_files = []
