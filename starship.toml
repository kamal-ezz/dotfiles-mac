"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

scan_timeout = 100
palette = "everforest_dark_hard"

# Colors from the Everforest Dark Hard palette (see [palettes.everforest_dark_hard] below)
[directory]
style = "bold ef_green"

[character]
success_symbol = "[❯](ef_purple)"
error_symbol = "[❯](ef_red)"
vimcmd_symbol = "[❮](ef_aqua)"

[git_branch]
format = "[$branch]($style)"
style = "ef_grey"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](ef_purple)( $ahead_behind$stashed) ]($style)"
style = "ef_aqua"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = ' \([$state( $progress_current/$progress_total)]($style)\) '
style = "ef_grey"

[cmd_duration]
format = "[$duration]($style) "
style = "ef_yellow"

[python]
format = "[$virtualenv]($style) "
style = "ef_grey"
detect_extensions = []
detect_files = []

# https://github.com/sainnhe/everforest (dark, hard)
[palettes.everforest_dark_hard]
ef_green = "#a7c080"
ef_aqua = "#83c092"
ef_purple = "#d699b6"
ef_red = "#e67e80"
ef_yellow = "#dbbc7f"
ef_grey = "#859289"
