[opener]
edit = [
  { run = "nvim %s", desc = "Edit with Neovim", for = "unix", block = true },
]
chrome = [
  { run = 'open -a "Google Chrome" %s', desc = "Open with Chrome", for = "macos", orphan = true },
]
play = [
  { run = "mpv -- %s", desc = "Play with mpv", for = "unix", orphan = true },
]

[open]
prepend_rules = [
  { url = "*.{html,htm}", use = ["chrome", "edit"] },
  { mime = "text/html", use = ["chrome", "edit"] },
  { mime = "{audio,video}/*", use = ["play", "reveal"] },
]
