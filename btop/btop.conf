# Modeled on KDE System Monitor's Overview page: flat bars, quiet borders and
# nothing beyond CPU, memory, disks, network and the process list. Only options
# that differ from btop's defaults are listed.

# btop saves every setting on exit, which would expand this file through the
# symlink. Change settings here; changes made in btop's menu last until you quit.
save_config_on_exit = false

### Look
color_theme = "dotfiles"
theme_background = false      # keep the terminal's background
graph_symbol = "block"        # solid graphs instead of braille dots
clock_format = ""             # no clock in the top border

### CPU
cpu_single_graph = true       # one usage graph instead of a mirrored pair
show_cpu_freq = false
show_cpu_watts = false
show_coretemp = false
show_uptime = false

### Memory and disks
mem_graphs = false            # usage bars instead of history graphs
swap_disk = false             # list swap with memory, not as a disk
show_io_stat = false          # usage only, no disk activity graphs

### Processes
proc_sorting = "memory"
proc_cpu_graphs = false       # no per-process mini graphs
proc_colors = false
proc_gradient = false         # rows keep one color down the list

### Battery
show_battery_watts = false

### Layouts, cycled with p (preset 0 is the full overview)
presets = "proc:0:default cpu:0:default,mem:0:default,net:0:default"
