# VLC Redesign-inspired palette and geometry (Juxtopposed, CC BY 4.0).
# uosc shares its foreground color between controls and the seek indicator.
color=foreground=d37918,foreground_text=161616,background=1b1b1b,background_text=eeeeee,window_border=222222,curtain=0e0e0e,success=a5c76f,error=e98b78,match=d37918,heatmap=ab6314
opacity=timeline=1,position=0.3,chapters=0.55,slider=1,slider_gauge=0.75,controls=0,speed=1,menu=1,submenu=1,border=1,title=0,tooltip=1,thumbnail=1,curtain=0.75
border_radius=10
text_border=0
animation_duration=140
font_scale=1
scale_fullscreen=1
autohide=yes
proximity_in=16
proximity_out=60

# Files on the left, transport in the middle, tracks and queue on the right.
# Shuffle and repeat remain in the right-click Playback menu.
# player-chrome publishes the expanded layout flag; smaller windows keep the
# transport, menu, playlist and fullscreen buttons, with other actions in menus.
controls=menu,gap,<user-data/player-chrome/expanded>command:playlist_add:script-binding playlist/add-files?Add files (Ctrl+O),<user-data/player-chrome/expanded>command:content_paste:script-binding uosc/paste-to-playlist?Add copied path or URL (Ctrl+V),space,<!idle>prev,<!idle>play-pause,<!idle>next,space,<has_sub+user-data/player-chrome/expanded>subtitles,<has_audio+user-data/player-chrome/expanded>audio,<stream+user-data/player-chrome/expanded>stream-quality,<!idle+user-data/player-chrome/expanded>speed,gap,command:list_alt:script-binding uosc/playlist#playlist-count?Playlist (F8),fullscreen
controls_size=30
controls_margin=12
controls_spacing=6
controls_persistency=paused,audio,idle

# A compact dark seek strip; thumbnail previews still come from thumbfast.
timeline_style=line
timeline_size=28
timeline_line_width=3
timeline_border=0
timeline_persistency=paused,audio
timeline_heatmap=no
progress=never
destination_time=total
volume=right
volume_size=32
volume_border=0

# Readable, searchable lists, with more room for episode/track filenames.
menu_min_width=380
menu_item_height=38
menu_padding=10
menu_type_to_search=yes

# title-bar.lua draws the title, queue position and window buttons, and keeps
# OSD messages below itself; uosc only adds the window edge.
top_bar=no
adjust_osd_margins=no
window_border_size=1

# The spectrum provides the audio-only canvas instead of uosc's center icon.
disable_elements=audio_indicator

# Only advance within the queue; browsing should not mix in cover images.
autoload=no
load_types=video,audio,playlist
