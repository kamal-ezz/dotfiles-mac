# Queue controls. Keep p/Space as pause and arrow keys as seek.
F8          script-binding uosc/playlist
MBTN_MID    script-binding uosc/playlist
ctrl+o      script-binding playlist/add-files
ctrl+v      script-binding uosc/paste-to-playlist
ctrl+O      script-binding uosc/open-file # Browse; Shift+Enter/click appends
ctrl+alt+v  script-binding audio_visualizer/toggle

# Use uosc navigation so keyboard, mouse and shuffle all agree.
>           script-binding uosc/next
ENTER       script-binding uosc/next
<           script-binding uosc/prev
PGDWN       script-binding uosc/next
PGUP        script-binding uosc/prev
MBTN_FORWARD script-binding uosc/next
MBTN_BACK   script-binding uosc/prev
Shift+HOME  script-binding uosc/first
Shift+END   script-binding uosc/last

MBTN_RIGHT  script-binding uosc/menu
MENU        script-binding uosc/menu

# uosc context menu. Removing an entry here never deletes the media file.
# script-binding playlist/add-files        #! Add files to playlist…
# script-binding uosc/paste-to-playlist    #! Add copied path or URL
# script-binding uosc/open-file           #! Browse files (Shift+Enter to add)
# script-binding uosc/playlist            #! Playlist
# script-binding uosc/shuffle             #! Playback > Toggle shuffle
# cycle-values loop-playlist no inf       #! Playback > Toggle playlist repeat
# cycle-values loop-file no inf           #! Playback > Toggle file repeat
# playlist-clear                         #! Playback > Clear queue except current
# script-binding uosc/subtitles           #! Tracks > Subtitles
# script-binding uosc/audio               #! Tracks > Audio
# script-binding uosc/video               #! Tracks > Video
# script-binding uosc/chapters            #! Chapters
# script-binding audio_visualizer/toggle  #! View > Toggle audio visualizer
# script-binding uosc/show-in-directory   #! Show current file in folder
# script-binding uosc/keybinds            #! Key bindings
# quit                                   #! Quit
