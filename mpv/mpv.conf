### Video output / quality (balanced)
vo=gpu-next                   # mpv picks the macOS GPU API and context itself
hwdec=auto-safe               # VideoToolbox hardware decoding on macOS

profile=high-quality          # sane built-in quality baseline
scale=ewa_lanczossharp        # upscaling
dscale=hermite                # downscaling (cheap + clean)
cscale=ewa_lanczossharp
deband=yes                    # removes banding in low-bitrate encodes
deband-iterations=2
video-sync=display-resample   # smooth motion matched to refresh rate
interpolation=no              # flip to yes for smoother pans (costs GPU)

### Behavior
save-position-on-quit=yes     # resume where you left off
watch-later-options-remove=sid,aid,volume  # don't freeze track/volume choices
keep-open=yes                 # advance through queue; stay open at the last item
idle=yes                      # allow adding files after stopping/clearing playback
force-window=yes              # keep queue controls available for audio and idle
geometry=1280x720             # fixed window size, video letterboxed inside
auto-window-resize=no         # keep that size across files/resolutions
cursor-autohide=1000
volume=100
volume-max=150

### Cache
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=150MiB

### Audio / subtitles
alang=jpn,ja,eng,en
slang=eng,en
sub-auto=fuzzy                # load subs with similar filenames
audio-file-auto=fuzzy
sub-font-size=44
sub-outline-size=2.5
sub-shadow-offset=1

### Screenshots
screenshot-format=png
screenshot-dir=~/Pictures/mpv
screenshot-template="%F-%P"

### Playlist
# Dropping files adds to the queue instead of unexpectedly replacing playback.
drag-and-drop=append
osd-playlist-entry=filename    # stable, recognizable episode/track names

### UI (uosc replaces the default OSC)
title=${media-title} [${playlist-pos-1}/${playlist-count}]
osc=no
osd-bar=no
border=no                     # title-bar.lua draws the title and window buttons
osd-font='sans-serif'
